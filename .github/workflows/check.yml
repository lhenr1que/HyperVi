# Runs the project's single validation command (tools/check.sh) on every push and pull request.
# Arch Linux, because the plugin builds against the Hyprland headers Arch ships (0.57 at the time of writing):
# a new Hyprland in Arch that breaks the plugin build shows up here first.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git lua rust gtk4 gtk4-layer-shell hyprland python perl
          useradd -m builder
      - uses: actions/checkout@v4
      - name: Hyprland version
        run: pkg-config --modversion hyprland
      - name: tools/check.sh
        # as a regular user: some tests check how unreadable files are handled, which root would read anyway
        run: |
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && git config --global --add safe.directory '$GITHUB_WORKSPACE' && bash tools/check.sh"
